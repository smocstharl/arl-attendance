<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARL Attendance</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f9;color:#193442;font:15px/1.6 Arial,Tahoma,sans-serif}[hidden]{display:none!important}header{background:white;border-bottom:1px solid #dce7eb;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}strong{font-size:23px;color:#007f83}.card{max-width:460px;margin:48px auto;background:white;padding:28px;border:1px solid #dce7eb;border-radius:16px}label{display:block;margin:16px 0 6px}input,button{font:inherit;border:1px solid #dce7eb;border-radius:8px;padding:10px}input{width:100%}button{cursor:pointer;background:#007f83;color:white}button:disabled{opacity:.5}#login{margin-top:20px;width:100%}#status{white-space:pre-wrap;color:#007f83}small{color:#627b83}iframe{border:0;width:100%;height:calc(100vh - 82px)}#workspace{height:calc(100vh - 82px)}#account{font-size:13px}
header{display:none}#workspace,iframe{height:100vh;height:100dvh}iframe{display:block}</style></head><body><header><div><span id="account"></span> <button id="logout" hidden>ออกจากระบบ</button></div></header><section class="card" id="login-panel"><h1>Attendance Login</h1><p>Central / Team Assistance / Manager</p><form id="login-form"><label for="username">Username</label><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{2,31}" title="3–32 ตัวอักษร: a–z, 0–9, จุด, ขีดกลาง, ขีดล่าง" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="login" type="submit">เข้าสู่ระบบ</button></form><p><a href="./reset-password.html">ลืมรหัสผ่าน / ขอเพิ่มบัญชี — ติดต่อ Admin</a></p><p id="status" role="status">ใช้ Username และรหัสผ่านของแอปที่ Admin จัดให้</p><small>Token เก็บใน RAM เท่านั้น รีเฟรชต้อง Login ใหม่ · ไฟล์คำนวณใน Browser · ส่งผล Attendance เมื่อกดบันทึก</small></section><section id="workspace" hidden></section><script src="./config.js"></script><script src="./auth.js?v=arl-0.1.0"></script></body></html>
